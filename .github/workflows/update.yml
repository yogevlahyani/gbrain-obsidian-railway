name: Update pinned versions

on:
  schedule:
    - cron: "17 9 * * 1" # weekly Monday 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump GBrain VERSION
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(tr -d '[:space:]' < gbrain/VERSION)"
          latest="$(gh api repos/garrytan/gbrain/releases/latest --jq .tag_name)"
          latest="${latest#v}"
          if [ "$current" != "$latest" ]; then
            printf '%s\n' "$latest" > gbrain/VERSION
            echo "Updated gbrain/VERSION: $current -> $latest"
          else
            echo "GBrain already at $current"
          fi

      - name: Bump caddy tag (edge + quartz image)
        run: |
          set -euo pipefail
          for file in caddy/Dockerfile quartz/Dockerfile; do
            # quartz uses `FROM caddy:… AS caddybin`
            current="$(sed -n 's|^FROM caddy:\([^ ]*\).*|\1|p' "$file" | head -1)"
            latest="$(curl -fsSL 'https://hub.docker.com/v2/repositories/library/caddy/tags?page_size=50&ordering=-last_updated' \
              | python3 -c '
import json,sys,re
d=json.load(sys.stdin)
pat=re.compile(r"^\d+\.\d+\.\d+$")
for r in d.get("results",[]):
  n=r["name"]
  if pat.match(n):
    print(n); break
')"
            if [ -z "$latest" ]; then
              echo "Could not resolve caddy tag; leaving $file ($current)"
              continue
            fi
            if [ "$current" != "$latest" ]; then
              sed -i "s|^FROM caddy:[^ ]*|FROM caddy:${latest}|" "$file"
              echo "Updated $file: $current -> $latest"
            else
              echo "$file already at $current"
            fi
          done

      - name: Commit if changed
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No version changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gbrain/VERSION caddy/Dockerfile quartz/Dockerfile
          git commit -m "chore: bump pinned image/binary versions"
          git push
